# Native OpenPERouter static input for the pinned source, NOT a Kube-OVN CR.
# Requires Mac_setings_for_l2vni_and_l3vni@60a1285935b10eb0b1cf07e4533faefedde3d4d3.
# Experimental lab fixture; not deployed by Kube-OVN.
# The systemd service reads /var/lib/openperouter/openpe_*.yaml.
underlays:
  - asn: 64514
    routerIDCIDR: 198.18.0.0/20
    tunnelEndpoint:
      cidrs:
        - 198.18.0.0/20
    interfaces:
      - type: NetworkDevice
        networkDevice:
          interfaceName: fabric0
    neighbors:
      - asn: 64512
        interface: fabric0
        holdTimeSeconds: 9
        keepaliveTimeSeconds: 3
    # gracefulRestart intentionally absent. Remote VTEPs are learned by EVPN.
l3vnis:
  - name: tenant-a
    vrf: tenant-a
    vni: 10001
    rdAssignedNumber: 1
    importRTs:
      - '64512:10001'
    exportRTs:
      - '64512:10001'
    hostSession:
      asn: 64514
      hostASN: 64515
      localCIDRs:
        - 169.254.16.0/20
l2vnis:
  - name: tenant-a-blue
    vni: 10101
    gatewayIPs:
      - 10.101.1.1/24
    gatewayMAC: '02:00:05:00:03:00'
    rdAssignedNumber: 2
    importRTs:
      - '64512:10101'
    exportRTs:
      - '64512:10101'
    routingDomain:
      type: L3VNI
      l3vni:
        name: tenant-a
  - name: tenant-a-green
    vni: 10102
    gatewayIPs:
      - 10.101.2.1/24
    gatewayMAC: '02:00:05:00:03:00'
    rdAssignedNumber: 3
    importRTs:
      - '64512:10102'
    exportRTs:
      - '64512:10102'
    routingDomain:
      type: L3VNI
      l3vni:
        name: tenant-a
