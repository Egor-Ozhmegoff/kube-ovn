# Install beside the pinned upstream controller.container as
# /etc/containers/systemd/controller.container.d/10-kubeovn.conf.
# The upstream mount maps /var/lib/openperouter to /etc/openperouter.
# Explicitly align the static config directory with Kube-OVN's bootstrapDir.
[Container]
Exec=--frrconfig /etc/perouter/frr/frr.conf --pid-path /etc/perouter/frr/frr.pid --reloader-socket /etc/perouter/frr/frr.socket --mode host --namespace openperouter-system --cni-plugin-dirs=/opt/openperouter/cni/bin/ --cni-cache-dir=/var/lib/openperouter/cni/cache --host-configuration-dir=/etc/openperouter --node-config=/etc/openperouter/node-config.yaml
