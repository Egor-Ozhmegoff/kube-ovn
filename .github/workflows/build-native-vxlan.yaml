name: Fork native VXLAN image

on:
  push:
    branches: [native-vxlan-support]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository_owner != 'kubeovn'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - name: Build fork binaries and publish architecture image
        env:
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-native-vxlan"
          mkdir -p "$DOCKER_CONFIG"
          export OUTPUT_DIR="$RUNNER_TEMP/native-vxlan-context"
          bash hack/external-vxlan/build-image.sh binaries
          base=$(awk -v arch="$ARCH" '$1 == arch {print $2}' hack/external-vxlan/base-images.txt)
          image="ghcr.io/${OWNER,,}/kube-ovn-native-vxlan:sha-$SHA-$ARCH"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          docker buildx build --platform "linux/$ARCH" --build-arg "BASE_IMAGE=$base" --tag "$image" --push "$OUTPUT_DIR"
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Publish immutable commit tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-native-vxlan"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
          image="ghcr.io/${OWNER,,}/kube-ovn-native-vxlan"
          docker buildx imagetools create -t "$image:sha-$SHA" "$image:sha-$SHA-amd64" "$image:sha-$SHA-arm64"
