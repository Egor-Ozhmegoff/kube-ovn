log stdout informational
log timestamp precision 3
hostname hostsession-lab
ip nht resolve-via-default
ipv6 nht resolve-via-default
vrf tenant-a
  vni 10001
exit-vrf
vrf tenant-a
  vni 10001
exit-vrf

route-map allowall permit 1
router bgp 64514
  no bgp ebgp-requires-policy
  no bgp network import-check
  no bgp default ipv4-unicast
  bgp bestpath as-path multipath-relax
  bgp router-id 192.0.2.1
  neighbor 192.0.2.2 remote-as 64512
  
  
  

  address-family ipv4 unicast
    neighbor 192.0.2.2 activate
    neighbor 192.0.2.2 allowas-in
  exit-address-family
  address-family l2vpn evpn
    neighbor 192.0.2.2 activate
    neighbor 192.0.2.2 allowas-in
  exit-address-family
exit
!
router bgp 64514 vrf tenant-a
  no bgp ebgp-requires-policy
  no bgp network import-check
  no bgp default ipv4-unicast
  bgp router-id 192.0.2.1
  
  neighbor 169.254.16.13 remote-as 64515

  address-family ipv4 unicast
    network 169.254.16.13/32
    neighbor 169.254.16.13 activate
    neighbor 169.254.16.13 route-map allowall in
    neighbor 169.254.16.13 route-map allowall out
  exit-address-family

  address-family ipv6 unicast
    neighbor 169.254.16.13 activate
    neighbor 169.254.16.13 route-map allowall in
    neighbor 169.254.16.13 route-map allowall out
  exit-address-family

  address-family l2vpn evpn
    advertise ipv4 unicast
    advertise ipv6 unicast
  exit-address-family
exit
router bgp 64514 vrf tenant-a
  no bgp ebgp-requires-policy
  no bgp network import-check
  no bgp default ipv4-unicast
  bgp router-id 192.0.2.1
  
  neighbor fd00:16::d remote-as 64515

  address-family ipv4 unicast
    neighbor fd00:16::d activate
    neighbor fd00:16::d route-map allowall in
    neighbor fd00:16::d route-map allowall out
  exit-address-family

  address-family ipv6 unicast
    network fd00:16::d/128
    neighbor fd00:16::d activate
    neighbor fd00:16::d route-map allowall in
    neighbor fd00:16::d route-map allowall out
  exit-address-family

  address-family l2vpn evpn
    advertise ipv4 unicast
    advertise ipv6 unicast
  exit-address-family
exit
